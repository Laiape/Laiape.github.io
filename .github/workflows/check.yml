name: Check portfolio
on:
  pull_request:
    branches: [main, redesign/rig-sheet]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pages and public package
        run: python3 .github/check_site.py --package
      - name: Check video comparisons
        run: node .github/test_video.cjs
